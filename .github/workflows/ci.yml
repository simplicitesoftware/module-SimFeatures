name: CI

on:
  push:
    branches:
      - "7.0"

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy test stack
        run: |
          chmod +x ./others/cicd/simci
          # Portainer uses a self-signed / private CA cert from GitHub runners
          printf 'insecure\n' >> ~/.curlrc
          export PORTAINER_INSECURE_SSL=1
          export PORTAINER_API_TOKEN="${{ secrets.PORTAINER_API_TOKEN }}"
          export IO_PASSWORD="${{ secrets.IO_PASSWORD }}"
          export REGISTRY_ID="${{ vars.REGISTRY_ID }}"
          if [[ -z "$REGISTRY_ID" ]]; then
            export REGISTRY_ID="${{ secrets.REGISTRY_ID }}"
          fi
          if [[ -z "$REGISTRY_ID" ]]; then
            echo "::error::REGISTRY_ID is empty. Set Actions variable REGISTRY_ID=1 (Portainer Registries → simplicite → Id)."
            echo "GitHub → Settings → Secrets and variables → Actions → Variables → New repository variable"
            exit 1
          fi
          echo "Using REGISTRY_ID=$REGISTRY_ID"
          ./others/cicd/simci portainer-stack-delete gitlab-simfeatures "${{ secrets.PORTAINER_URL }}"
          ./others/cicd/simci portainer-stack-deploy -f ./others/cicd/portainer-stack.yml gitlab-simfeatures "${{ secrets.PORTAINER_URL }}"

  unit-tests:
    runs-on: ubuntu-latest
    needs: deploy-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          chmod +x ./others/cicd/simci
          printf 'insecure\n' >> ~/.curlrc
          export PORTAINER_INSECURE_SSL=1
          export PORTAINER_API_TOKEN="${{ secrets.PORTAINER_API_TOKEN }}"
          export IO_PASSWORD="${{ secrets.IO_PASSWORD }}"
          ./others/cicd/simci simplicite-run-unit-tests SimFeatures gitlab-simfeatures "${{ secrets.PORTAINER_URL }}"
          ./others/cicd/simci portainer-stack-get-coverage -v gitlab-simfeatures "${{ secrets.PORTAINER_URL }}"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: jacoco.xml
          if-no-files-found: error

  sonarcloud-check:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: ${{ vars.SONARCLOUD_ENABLED || 'false' }}
    env:
      MAVEN_OPTS: -Dmaven.repo.local=.m2/repository
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Maven and SonarCloud files
        uses: actions/cache@v4
        with:
          path: |
            .sonar/cache
            .m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report

      - name: Run SonarCloud analysis
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.coverage.jacoco.xmlReportPaths=jacoco.xml

