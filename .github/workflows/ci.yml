name: CI

on:
  push:
    branches:
      - "7.0"

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Recreate the Portainer test stack with a fresh platform image, then wait for health.
      # REGISTRY_ID: Portainer registry numeric Id (Registries → simplicite) — needed for private pulls.
      # PORTAINER_INSECURE_SSL: skip TLS verify (Portainer often uses a self-signed cert from runners).
      - name: Deploy test stack
        env:
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          IO_PASSWORD: ${{ secrets.IO_PASSWORD }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_INSECURE_SSL: "1"
          REGISTRY_ID: ${{ vars.REGISTRY_ID || secrets.REGISTRY_ID }}
        run: |
          chmod +x ./others/cicd/simci
          if [[ -z "$REGISTRY_ID" ]]; then
            echo "::error::Set Actions variable REGISTRY_ID to the Portainer registry Id (Registries → simplicite)."
            exit 1
          fi
          # Delete + deploy ensures a clean stack; deploy pre-pulls registry.simplicite.io/platform:7-alpha.
          ./others/cicd/simci portainer-stack-delete gitlab-simfeatures "$PORTAINER_URL"
          ./others/cicd/simci portainer-stack-deploy -f ./others/cicd/portainer-stack.yml gitlab-simfeatures "$PORTAINER_URL"

  unit-tests:
    runs-on: ubuntu-latest
    needs: deploy-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run module unit tests on the deployed stack and fetch jacoco.xml from the volume.
      - name: Run unit tests
        env:
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          IO_PASSWORD: ${{ secrets.IO_PASSWORD }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_INSECURE_SSL: "1"
        run: |
          chmod +x ./others/cicd/simci
          ./others/cicd/simci simplicite-run-unit-tests SimFeatures gitlab-simfeatures "$PORTAINER_URL"
          ./others/cicd/simci portainer-stack-get-coverage -v gitlab-simfeatures "$PORTAINER_URL"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: jacoco.xml
          if-no-files-found: error

  sonarcloud-check:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: ${{ vars.SONARCLOUD_ENABLED || 'false' }}
    env:
      MAVEN_OPTS: -Dmaven.repo.local=.m2/repository
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Maven and SonarCloud files
        uses: actions/cache@v4
        with:
          path: |
            .sonar/cache
            .m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report

      - name: Run SonarCloud analysis
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.coverage.jacoco.xmlReportPaths=jacoco.xml
