name: simci
help: Simplicité CI/CD Tooling
version: 0.1.0

commands:
- name: deploy-portainer-stack
  help: Deploys a Portainer stack

  args:
  - name: stack
    required: true
    help: Stack name

  - name: portainer_server
    required: true
    help: Base URL used by traefik for server (portainer.<base_url> , my-app.<base_url>, etc.)

  flags:
  - long: --file
    short: -f
    help: Docker compose file path 
    arg: file
    required: true

  - long: --environment
    help: Portainer environment
    arg: env
    default: "1"

  examples:
  - simci deploy-portainer-stack -f docker-compose.yml  mystackname <base_url>

  environment_variables:
  - name: IO_PASSWORD
    help: Simplicité IO password
    required: true
  - name: PORTAINER_API_TOKEN
    required: true

- name: delete-portainer-stack
  help: Deletes a Portainer stack

  args:
  - name: stack
    required: true
    help: Stack name

  - name: portainer_server
    required: true
    help: Base URL used by traefik for server (portainer.<base_url> , my-app.<base_url>, etc.)

  flags:
  - long: --environment
    help: Portainer environment
    arg: env
    default: "1"

  examples:
  - simci delete-portainer-stack mystackname <base_url>

  environment_variables:
  - name: PORTAINER_API_TOKEN
    required: true

- name: run-unit-tests
  help: Runs unit tests

  args:
  - name: module
    required: true
    help: Simplicité module name

  - name: stack
    required: true
    help: Stack name

  - name: portainer_server
    required: true
    help: Base URL used by traefik for server (portainer.<base_url> , my-app.<base_url>, etc.)

  environment_variables:
  - name: IO_PASSWORD
    help: Simplicité IO password
    required: true