variables:
  SONARCLOUD_ENABLED: "false"

stages:
  - build
  - test
  - code-quality

# Recreate Portainer test stack (pre-pulls private platform image via REGISTRY_ID).
# Requires CI variables: PORTAINER_API_TOKEN, IO_PASSWORD, PORTAINER_URL, REGISTRY_ID.
deploy-test:
  stage: build
  variables:
    # Skip TLS verify for Portainer (self-signed / private CA from runners).
    PORTAINER_INSECURE_SSL: "1"
  script:
    - ./others/cicd/simci portainer-stack-delete gitlab-simfeatures $PORTAINER_URL
    - ./others/cicd/simci portainer-stack-deploy -f ./others/cicd/portainer-stack.yml gitlab-simfeatures $PORTAINER_URL

playwright-tests:
  stage: test
  needs: [deploy-test]
  image: mcr.microsoft.com/playwright:v1.56.1-jammy
  variables:
    BASE_URL: "https://gitlab-simfeatures.${PORTAINER_URL}/ui"
    USER_NAME: playwright
    PASSWORD: "${PLAYWRIGHT_PASSWORD}"
  before_script:
    - cd others/playwright
    - npm ci
  script:
    # Wait for the deployed app to answer before running browser tests.
    - |
      for i in $(seq 1 30); do
        if curl -sf -o /dev/null "$BASE_URL"; then
          echo "App is ready"
          break
        fi
        echo "Waiting for app... ($i/30)"
        sleep 10
      done
      curl -sf -o /dev/null "$BASE_URL" || (echo "App failed to become ready" && exit 1)
    - npx playwright test --project=chromium
  artifacts:
    when: on_failure
    paths:
      - others/playwright/playwright-report/
    expire_in: 7 days

# Run module unit tests on the deployed stack and publish jacoco.xml.
unit-tests:
  stage: test
  variables:
    PORTAINER_INSECURE_SSL: "1"
  script:
    - ./others/cicd/simci simplicite-run-unit-tests SimFeatures gitlab-simfeatures $PORTAINER_URL
    - ./others/cicd/simci portainer-stack-get-coverage -v gitlab-simfeatures $PORTAINER_URL
  artifacts:
    paths:
      - jacoco.xml
    expire_in: 1 hour

sonarcloud-check:
  image: maven:3.9-eclipse-temurin-21-alpine
  stage: code-quality
  dependencies:
    - unit-tests
  cache:
    key:
      files:
        - pom.xml
      prefix: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
      - .m2/repository
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  script:
    - apk update && apk add nodejs npm
    - ls -halt
    - mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.coverage.jacoco.xmlReportPaths=jacoco.xml
  rules:
    - if: '$SONARCLOUD_ENABLED'

