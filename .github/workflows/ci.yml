name: CI

on:
  workflow_dispatch:

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy test stack
        run: |
          chmod +x ./others/cicd/simci
          export PORTAINER_API_TOKEN="${{ secrets.PORTAINER_API_TOKEN }}"
          export IO_PASSWORD="${{ secrets.IO_PASSWORD }}"
          ./others/cicd/simci portainer-stack-delete gitlab-simfeatures "${{ secrets.PORTAINER_URL }}"
          ./others/cicd/simci portainer-stack-deploy -f ./others/cicd/portainer-stack.yml gitlab-simfeatures "${{ secrets.PORTAINER_URL }}"

  unit-tests:
    runs-on: ubuntu-latest
    needs: deploy-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          chmod +x ./others/cicd/simci
          export PORTAINER_API_TOKEN="${{ secrets.PORTAINER_API_TOKEN }}"
          export IO_PASSWORD="${{ secrets.IO_PASSWORD }}"
          ./others/cicd/simci simplicite-run-unit-tests SimFeatures gitlab-simfeatures "${{ secrets.PORTAINER_URL }}"
          ./others/cicd/simci portainer-stack-get-coverage -v gitlab-simfeatures "${{ secrets.PORTAINER_URL }}"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: jacoco.xml
          if-no-files-found: error

  playwright-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright dependencies
        working-directory: ./others/playwright
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./others/playwright
        run: npx playwright install

      - name: Wait for app to be ready
        run: |
          APP_URL="https://gitlab-simfeatures.${{ secrets.PORTAINER_URL }}/ui"
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "$APP_URL"; then
              echo "App is ready"
              break
            fi
            echo "Waiting for app... ($i/30)"
            sleep 10
          done
          curl -sf -o /dev/null "$APP_URL" || (echo "App failed to become ready" && exit 1)

      - name: Run Playwright tests
        working-directory: ./others/playwright
        env:
          CI: true
          BASE_URL: "https://gitlab-simfeatures.${{ secrets.PORTAINER_URL }}/ui"
          USER_NAME: user
          PASSWORD: ${{ secrets.PLAYWRIGHT_PASSWORD }}
        run: npx playwright test --project=firefox

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: others/playwright/playwright-report/
          retention-days: 7

  sonarcloud-check:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: ${{ vars.SONARCLOUD_ENABLED || 'false' }}
    env:
      MAVEN_OPTS: -Dmaven.repo.local=.m2/repository
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Maven and SonarCloud files
        uses: actions/cache@v4
        with:
          path: |
            .sonar/cache
            .m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report

      - name: Run SonarCloud analysis
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.coverage.jacoco.xmlReportPaths=jacoco.xml

